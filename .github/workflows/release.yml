name: Release

# Pushing a tag such as v3.0.0 runs the tests, builds the artifacts and
# publishes a GitHub release with a SHA256SUMS file. install.sh users can then
# pin ENCRYPTOR_REF=v3.0.0 and ENCRYPTOR_SHA256=<checksum of the source tarball>.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the program version
        run: |
          version="$(bash encryptor.sh version | awk '{print $2}')"
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != program $version"; exit 1; }
      - name: Tests
        run: bash tests/run.sh
      - name: Build artifacts
        run: |
          ./build_deb.sh
          git archive --format=tar.gz --prefix="encryptor-${GITHUB_REF_NAME#v}/" -o "encryptor-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum encryptor_*.deb encryptor-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" encryptor_*.deb encryptor-*.tar.gz SHA256SUMS --title "Encryptor ${GITHUB_REF_NAME}" --generate-notes
