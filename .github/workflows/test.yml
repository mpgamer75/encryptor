name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Static analysis ──────────────────────────────────────────────────────
  lint:
    name: Lint (bash -n, ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in encryptor.sh install.sh uninstall.sh build_deb.sh lib/*.sh tests/run.sh; do
            bash -n "$f"
          done
      - name: ShellCheck (per file)
        run: shellcheck -S warning encryptor.sh install.sh uninstall.sh build_deb.sh lib/*.sh tests/run.sh
      - name: ShellCheck (whole program, catches unused/undefined cross-module names)
        run: |
          cat lib/core.sh lib/ui.sh lib/crypto.sh lib/certs.sh lib/audit.sh lib/tui.sh lib/cli.sh encryptor.sh > "$RUNNER_TEMP/program.sh"
          shellcheck --norc -s bash -S warning "$RUNNER_TEMP/program.sh"

  # ── 2. Test suite (required) ────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: bash --version | head -n 1 && openssl version
      - name: Run test suite
        run: bash tests/run.sh

  # ── 3. Compatibility (informational: does not block merges) ─────────────────
  compat-openssl-111:
    name: Compatibility — OpenSSL 1.1.1 (Debian 11)
    runs-on: ubuntu-latest
    container: debian:11
    continue-on-error: true
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates git python3
      - uses: actions/checkout@v4
      - name: Versions
        run: bash --version | head -n 1 && openssl version
      - name: Run test suite
        run: bash tests/run.sh

  compat-macos:
    name: Compatibility — macOS (Homebrew bash + OpenSSL 3)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bash openssl@3
      - name: Run test suite
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$(brew --prefix)/bin:$PATH"
          bash --version | head -n 1 && openssl version
          bash tests/run.sh

  # ── 4. Packaging ────────────────────────────────────────────────────────────
  package:
    name: Debian package + installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./build_deb.sh
      - name: Install the package and run the self-test
        run: |
          sudo apt-get install -y ./encryptor_*.deb
          test "$(command -v encryptor)" = /usr/bin/encryptor
          encryptor version
          encryptor selftest
          man -w encryptor
      - name: Installer into a custom prefix
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/encryptor" selftest
          ./uninstall.sh --prefix "$RUNNER_TEMP/prefix" </dev/null
          test ! -e "$RUNNER_TEMP/prefix/bin/encryptor"
