name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Static analysis ──────────────────────────────────────────────────────
  lint:
    name: Lint (bash -n, ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in encryptor.sh install.sh uninstall.sh build_deb.sh build_release.sh lib/*.sh tests/run.sh; do
            bash -n "$f"
          done
      - name: ShellCheck (per file)
        run: shellcheck -S warning encryptor.sh install.sh uninstall.sh build_deb.sh build_release.sh lib/*.sh tests/run.sh
      - name: ShellCheck (whole program, catches unused/undefined cross-module names)
        run: |
          cat lib/core.sh lib/ui.sh lib/crypto.sh lib/certs.sh lib/audit.sh lib/tui.sh lib/cli.sh encryptor.sh > "$RUNNER_TEMP/program.sh"
          shellcheck --norc -s bash -S warning "$RUNNER_TEMP/program.sh"

  # ── 2. Test suite (required) ────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest matters separately: recent Ubuntu ships uutils (Rust)
        # coreutils, whose tools differ from GNU's in corner cases.
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: bash --version | head -n 1 && openssl version && (tail --version | head -n 1)
      - name: Run test suite
        run: bash tests/run.sh

  # ── 3. Compatibility (required: these are supported platforms) ───────────────
  compat-openssl-111:
    name: Compatibility — OpenSSL 1.1.1 (Ubuntu 20.04)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install tools
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssl ca-certificates git python3
      - uses: actions/checkout@v4
      - name: Versions
        run: bash --version | head -n 1 && openssl version
      - name: Run test suite
        run: bash tests/run.sh

  compat-macos:
    name: Compatibility — macOS (Homebrew bash + OpenSSL 3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bash openssl@3
      - name: Run test suite
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$(brew --prefix)/bin:$PATH"
          bash --version | head -n 1 && openssl version
          bash tests/run.sh

  # ── 4. Packaging ────────────────────────────────────────────────────────────
  package:
    name: Debian package + installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./build_deb.sh
      - name: Install the package and run the self-test
        run: |
          sudo apt-get install -y ./encryptor_*.deb
          test "$(command -v encryptor)" = /usr/bin/encryptor
          encryptor version
          encryptor selftest
          man -w encryptor
      - name: Installer into a custom prefix
        run: |
          ./install.sh --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/encryptor" selftest
          ./uninstall.sh --prefix "$RUNNER_TEMP/prefix" </dev/null
          test ! -e "$RUNNER_TEMP/prefix/bin/encryptor"

  # ── 5. Release pipeline dry run (same script the Release workflow uses) ──────
  release-dry-run:
    name: Release artifacts (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifacts
        run: ./build_release.sh
      - name: Check artifacts
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          dpkg-deb --info encryptor_*.deb | grep -q '^ Package: encryptor$'
          tar -tzf encryptor-*.tar.gz | grep -q '/lib/crypto.sh$'

  # ── 6. Container image ───────────────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (the Dockerfile runs the self-test)
        run: docker build -t encryptor:ci .
      - name: Round trip on a mounted volume, as the invoking user
        run: |
          mkdir vol
          echo "container payload" > vol/a.txt
          printf 'ci-container-passphrase\n' > vol/pass
          chmod 600 vol/pass
          run() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/vol:/data" encryptor:ci "$@"; }
          run encrypt -q -p /data/pass a.txt
          run decrypt -q -p /data/pass -o b.txt a.txt.enc
          cmp vol/a.txt vol/b.txt
          test "$(stat -c '%u %a' vol/a.txt.enc)" = "$(id -u) 600"
          test "$(docker run --rm --entrypoint id encryptor:ci -un)" = encryptor
      - name: Test suite inside the image (Alpine, busybox userland + coreutils)
        run: docker run --rm -v "$PWD:/src:ro" --entrypoint bash encryptor:ci -c 'cd /tmp && bash /src/tests/run.sh'
      - name: A file written in the container opens on the host
        run: bash encryptor.sh decrypt -q -p vol/pass -o - vol/a.txt.enc | cmp - vol/a.txt

  # ── 7. RPM package ───────────────────────────────────────────────────────────
  rpm:
    name: RPM package (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: dnf -y install rpm-build dnf-plugins-core tar gzip
      - uses: actions/checkout@v4
      - name: Build the RPM (runs the test suite in %check)
        run: |
          version="$(sed -n 's/^readonly ENCRYPTOR_VERSION="\(.*\)"$/\1/p' encryptor.sh)"
          mkdir -p ~/rpmbuild/SOURCES
          tar -czf ~/rpmbuild/SOURCES/encryptor-${version}.tar.gz --exclude=.git --transform "s,^\.,encryptor-${version}," .
          dnf -y builddep encryptor.spec     # only what the spec declares in BuildRequires
          rpmbuild -ba encryptor.spec
      - name: Install and run
        run: |
          rpm -i --nosignature ~/rpmbuild/RPMS/noarch/encryptor-*.noarch.rpm
          encryptor version
          encryptor selftest
          rpm -ql encryptor | grep -q '/usr/lib/encryptor/crypto.sh'
